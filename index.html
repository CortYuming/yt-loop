<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YT Loop — Loop any part of a YouTube video</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%81%3C/text%3E%3C/svg%3E" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>YT Loop</h1>
    <p class="sub">Loop any part of a YouTube video — built for music practice</p>
  </header>

  <section class="url-input">
    <input type="text" id="urlInput" placeholder="Paste a YouTube URL (press Enter to load)" />
    <button id="loadBtn">Load</button>
  </section>

  <section class="player-wrap">
    <div id="player"></div>
  </section>

  <section class="controls" hidden>
    <div class="row buttons">
      <button id="playLoopBtn">▶ Play</button>
      <label class="toggle-switch">
        <input type="checkbox" id="loopToggle" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>Loop</span>
      </label>
      <button id="saveBtn" hidden>💾 Save</button>
      <button id="newBtn">＋ New</button>
      <button id="deleteBtn" hidden>🗑 Delete</button>
      <button id="shareBtn">🔗 Share URL</button>
    </div>

    <div class="row">
      <span id="currentTime" class="time big">0:00.00</span>
      <select id="speedSelect">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="1.75">1.75x</option>
        <option value="2">2x</option>
      </select>
      <label>Duration: <span id="durationDisplay" class="time">—</span></label>
    </div>

    <div class="row start-end-row">
      <div class="field-group">
        <span class="field-label">Start</span>
        <div class="nudge-group">
          <input type="text" id="startInput" placeholder="0:00.00" size="10" value="0:00.00" />
          <button id="captureStart" class="pin" title="Capture current time">📍</button>
        </div>
      </div>
      <div class="field-group">
        <span class="field-label">End</span>
        <div class="nudge-group">
          <input type="text" id="endInput" placeholder="0:00.00" size="10" />
          <button id="captureEnd" class="pin" title="Capture current time">📍</button>
        </div>
      </div>
    </div>

    <div class="hint">
      Space: play / pause &nbsp;·&nbsp; S / E: jump to start / end &nbsp;·&nbsp; ← →: 0.05s (Shift: 1s) &nbsp;·&nbsp; in Start/End field: same nudges the value
    </div>
  </section>

  <section class="loops">
    <h2>Saved loops</h2>
    <div id="loopList"></div>
  </section>

  <footer>
    <small>All data is stored in your browser's localStorage.</small>
  </footer>
</main>

<script src="main.js"></script>
</body>
</html>
